name: Deploy Production
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: deploy-midas-prod
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: ap-southeast-1
  INSTANCE_ID: i-0574c0e78cb3ca1d1
  SERVICE_NAME: midas
  DEPLOY_DIR: /opt/midas
  DATA_DIR: /var/lib/midas
  ARCHIVE_NAME: midas-linux-x86_64.tar.gz
  METADATA_NAME: midas-linux-x86_64.metadata.json
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select release commit
        run: echo "DEPLOY_SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::524909477426:role/MidasGithubDeployRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Send managed deployment command
        run: |
          python3 - <<'PY' > ssm-parameters.json
          import json, os
          sha = os.environ["DEPLOY_SHA"]
          script_url = f"https://raw.githubusercontent.com/No-Trade-No-Life/Midas/{sha}/deploy/activate-release.sh"
          commands = [
            "set -eu",
            f"curl -fsSL {script_url} -o /tmp/midas-activate-release.sh",
            "chmod 700 /tmp/midas-activate-release.sh",
            f"MIDAS_DEPLOY_SHA={sha} MIDAS_DEPLOY_DIR={os.environ['DEPLOY_DIR']} MIDAS_DATA_DIR={os.environ['DATA_DIR']} MIDAS_SERVICE_NAME={os.environ['SERVICE_NAME']} MIDAS_ARCHIVE_NAME={os.environ['ARCHIVE_NAME']} MIDAS_METADATA_NAME={os.environ['METADATA_NAME']} /tmp/midas-activate-release.sh",
          ]
          print(json.dumps({"commands": commands}))
          PY
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy safe Midas skeleton $DEPLOY_SHA" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
